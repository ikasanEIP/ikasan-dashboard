header.active-job-plan-instances-dashboard=「アクティブなジョブ・プラン・インスタンス」ダッシュボード
help.active-job-plan-instances-dashboard-1=アクティブ ジョブ プラン インスタンス ダッシュボードでは、すべてのアクティブ ジョブ プランのすべてのジョブの最新の実行ステータスの概要が表示されます。ステータス グリッドのヘッダー行には、以下の画像に示すように、各ジョブ ステータスのすべてのプランのすべてのジョブの合計数を表示する一連のフィルタリング アイコンがあります。
help.active-job-plan-instances-dashboard-2=ステータス・グリッドのヘッダーの各集約ステータス項目をクリックすると、ステータス・グリッドをフィルタ処理し、選択した状態のジョブを含むすべてのジョブ・プランを表示できます。グリッドヘッダーのステータスアイコンの横にチェックマークが表示され、グリッドが特定のステータスによってフィルタされていることを示します。
help.active-job-plan-instances-dashboard-3=グリッドの各ステータス列には、そのステータスにあるジョブの数を示す色付きのステータスアイコンと、ジョブプランの詳細ビューを新しいタブに表示するボタンが表示されます。特定の状態のジョブがない場合、ボタンはアクティブになりません。ジョブ・プラン・インスタンスをオープンすると、ジョブ・インスタンス・タブが選択され、適切な状況によってフィルター処理されます。
help.active-job-plan-instances-dashboard-4=ジョブ プラン ステータス グリッドの右端には、ジョブ プランに表示される繰り返しジョブのすべての履歴実行のステータスを表示する 2 つの列があります。ジョブは、1 つのジョブ プラン インスタンス内で 1 回実行するように設定することも、複数回実行するように設定することもできます。ジョブ プランに繰り返しジョブが含まれており、それらが正常に完了したかエラーで完了した場合は、ステータス カウントが表示されます。各ステータス アイコンをクリックすると、ジョブ実行に関する詳細情報を取得できます。
