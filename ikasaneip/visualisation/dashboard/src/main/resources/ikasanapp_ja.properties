time-component.custom-week-day-of-month-help=W (“平日”) - 特定の日に最も近い平日 (月曜日から金曜日) を指定するために使用されます。たとえば、日付フィールドの値として「15W」を指定した場合、その意味は「その月の 15 日に最も近い平日」となります。したがって、15 日が土曜日の場合、トリガーは 14 日の金曜日に起動します。 15 日が日曜日の場合、トリガーは 16 日の月曜日に起動します。 15 日が火曜日の場合は、15 日の火曜日に実行されます。ただし、月日の値として「1W」を指定し、1 日が土曜日の場合、トリガーは月の日数の境界を「飛び越える」ことがないため、3 日の月曜日に起動します。 「W」文字は、月日が範囲や日のリストではなく単一の日である場合にのみ指定できます。
time-component.closest-week-day-of-month-help=W (“平日”) - 特定の日に最も近い平日 (月曜日から金曜日) を指定するために使用されます。たとえば、日付フィールドの値として「15W」を指定した場合、その意味は「その月の 15 日に最も近い平日」となります。したがって、15 日が土曜日の場合、トリガーは 14 日の金曜日に起動します。 15 日が日曜日の場合、トリガーは 16 日の月曜日に起動します。 15 日が火曜日の場合は、15 日の火曜日に実行されます。ただし、月日の値として「1W」を指定し、1 日が土曜日の場合、トリガーは月の日数の境界を「飛び越える」ことがないため、3 日の月曜日に起動します。 「W」文字は、月日が範囲や日のリストではなく単一の日である場合にのみ指定できます。
