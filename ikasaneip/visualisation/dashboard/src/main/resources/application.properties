# Maximum queued broadcasts per offline cluster peer before events are dropped and a WARN is logged.
# Each peer gets its own bounded queue; a peer that is down fills its queue and triggers the rejection handler
# rather than allowing unbounded memory growth. Increase if peers can legitimately fall behind by more
# than this many events during a brief outage.
ikasan.dashboard.cluster.peer-broadcast-queue-capacity=1000

# HTTP client timeouts for peer-to-peer broadcast connections.
# connect-timeout-ms: maximum time (ms) to establish a TCP connection to a cluster peer (default: 3000).
# read-timeout-ms: maximum time (ms) to wait for a response after the connection is established (default: 10000).
ikasan.dashboard.cluster.http.connect-timeout-ms=3000
ikasan.dashboard.cluster.http.read-timeout-ms=10000

# Circuit breaker settings for peer broadcast channels.
# failure-threshold: consecutive network-level failures before the circuit opens and broadcasts are suppressed (default: 5).
# open-duration-ms: how long (ms) the circuit stays open before a single probe attempt is allowed through (default: 30000).
ikasan.dashboard.cluster.circuit-breaker.failure-threshold=5
ikasan.dashboard.cluster.circuit-breaker.open-duration-ms=30000

