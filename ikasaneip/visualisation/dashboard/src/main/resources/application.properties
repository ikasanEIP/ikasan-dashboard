# Leader Election Configuration
# Enable leader election for clustered dashboard instances
ikasan.dashboard.cluster.enabled=true
# Provider: zookeeper (default, requires ZK cluster) | fixed (dev/test, no ZK required)
#ikasan.dashboard.cluster.provider=zookeeper
ikasan.dashboard.cluster.provider=fixed
# Fixed-role provider only: role for this peer (leader|follower). Defaults to leader.
#ikasan.dashboard.cluster.fixed-role=follower
ikasan.dashboard.cluster.fixed-role=leader

ikasan.dashboard.cluster.zookeeper.enabled=${ikasan.dashboard.cluster.enabled}
# ZooKeeper connection string (comma-separated list of host:port)
ikasan.dashboard.cluster.zookeeper.connection-string=${solr.cloud.zk.hosts}
# Session timeout in milliseconds
ikasan.dashboard.cluster.zookeeper.session-timeout-ms=30000
# Connection timeout in milliseconds
ikasan.dashboard.cluster.zookeeper.connection-timeout-ms=15000
# Base sleep time for retry policy
ikasan.dashboard.cluster.zookeeper.base-sleep-time-ms=1000
# Maximum number of retry attempts
ikasan.dashboard.cluster.zookeeper.max-retries=3
# ZooKeeper namespace for Ikasan leader election
ikasan.dashboard.cluster.zookeeper.namespace=ikasan
# Path for leader election
ikasan.dashboard.cluster.zookeeper.leader-path=/leader

