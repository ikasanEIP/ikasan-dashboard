<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style>
        div.container {
            display: inline-block;
        }
    </style>
</head>
<body>

<p>The following scheduled jobs have failed!</p>

<table>
    <tr>
        <th>Scheduled Job</th>
    </tr>
    <tr th:each="failedScheduledJob : ${failedScheduledJobs}"
        <td>
                <span th:text="${failedScheduledJob.event}"></span>
        </td>
    </tr>
</table>
<br/>
<br/>
<p>
    Regards, <br/>
    <em>The Ikasan Team</em>
</p>
</body>
</html>
