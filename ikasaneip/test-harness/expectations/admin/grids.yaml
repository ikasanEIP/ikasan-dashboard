# Administration list views. The security data is the baseline the dashboard creates on start-up
# (persistence/persistence-initialisation/src/main/resources/baseline-security/*.json).
# input:  route (dashboard route of the view)
# expect: size / minSize (item count), headers (column headers, in order), rows / rowsExact
# rows: every expected grid row with a value for every column (see org.ikasan.testharness.support.GridRows);
# rowsExact: the grid holds exactly these rows. Timestamps use {{...|table}}, the format the grids display.
# Values that genuinely vary (login times, session ids, fire times) reference these patterns as "@name".
patterns:
  timestamp: '/\d{2}/\d{2}/\d{4} \d{2}:\d{2}:\d{2}\.\d{3} \[.+ - .+\]/'
  optionalTimestamp: '/(\d{2}/\d{2}/\d{4} \d{2}:\d{2}:\d{2}\.\d{3} \[.+ - .+\]|N/A)?/'
  sessionId: '/[0-9A-F]{32}/'
  number: '/\d+/'

scenarios:
  - name: users view lists the admin user
    tags: [smoke, users]
    input: { route: userManagement }
    expect:
      headers: [Username, First Name, Surname, Email Address, Department, Last Access]
      rowsExact: true
      rows:
      - { "Username": "admin", "First Name": "Admin", "Surname": "User", "Email Address": "", "Department": "", "Last Access": "@timestamp" }

  - name: roles view lists the baseline roles
    tags: [smoke, roles]
    input: { route: roleManagement }
    expect:
      rowsExact: true
      rows:
      - { "Role Name": "ADMIN", "Description": "Users who may perform administration functions on the system" }
      - { "Role Name": "User", "Description": "Users who have a read only view on the system" }
      - { "Role Name": "RESTAccess", "Description": "Users who have Access to REST endpoint on the system" }
      - { "Role Name": "AdminUser", "Description": "Users who have Access to REST endpoint on the system" }
      - { "Role Name": "WriteUser", "Description": "Users who have Access to REST endpoint on the system" }

