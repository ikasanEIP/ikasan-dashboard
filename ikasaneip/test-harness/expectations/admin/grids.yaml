  # groups of type 'application' only arrive through an LDAP synchronisation, so the baseline has none
  - name: groups view is empty without LDAP
    tags: [groups]
    input: { route: groupManagement }
    expect: { size: 0, headers: [Group Name, Group Type, Description], rowsExact: true, rows: [] }

  # the dashboard's own harvesting and housekeeping jobs; fire times move, so they are patterns
  # (note: this view shows times in the server's zone, not the user's)
  - name: quartz scheduler view lists the dashboard jobs
    tags: [quartz]
    input: { route: quartzSchedulerView }
    expect:
      headers: [Job Name, Job Group, Next Fire Time, Previous Fire Time]
      rowsExact: true
      rows:
      - { "Job Name": "moduleMetaDataHarvestJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "wiretapHarvestingJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "exclusionHarvestingJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "moduleFlowStateJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "replayHarvestingJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "messageHistoryHarvestingJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "systemEventHarvestingJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "configurationMetaDataHarvestJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "errorReportingHarvestingJob", "Job Group": "harvest", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "messageHistoryHousekeepingJob", "Job Group": "housekeeping", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "systemEventServiceHousekeepingJob", "Job Group": "housekeeping", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "errorReportingHousekeepingJob", "Job Group": "housekeeping", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "wiretapHousekeepingJob", "Job Group": "housekeeping", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "replayHousekeepingJob", "Job Group": "housekeeping", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "persistenceHousekeepingJob", "Job Group": "housekeeping", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }
      - { "Job Name": "duplicateFilterHousekeepingJob", "Job Group": "housekeeping", "Next Fire Time": "@timestamp", "Previous Fire Time": "@optionalTimestamp" }

  # job locks only exist when job plans with locks run; the baseline has none
  - name: job lock view is empty without job plans
    tags: [joblocks]
    input: { route: jobLockView }
    expect: { size: 0, headers: [Environment, Lock Name, Lock Count, Current Lock holders, Queued Jobs Waiting For Lock], rowsExact: true, rows: [] }

  # every login (the harness, LoginIT) has a session, so only the harness admin's session shape is required
  - name: sessions view lists the harness session
    tags: [sessions]
    input: { route: sessionsView }
    expect:
      headers: [Session Identifier, Username, Session Size (bytes), Number of UI Instances, Session Creation Time, Session Last Accessed]
      rowsExact: false
      rows:
      - { "Session Identifier": "@sessionId", "Username": "admin", "Session Size (bytes)": "@number", "Number of UI Instances": "@number", "Session Creation Time": "@timestamp", "Session Last Accessed": "@timestamp" }
