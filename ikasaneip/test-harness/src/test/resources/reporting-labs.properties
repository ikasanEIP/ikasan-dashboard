# Reporting Labs (https://reportinglabs.dev) settings for the end-to-end tests. Any of these can be overridden with
# -D<key>=<value> or a REPORTING_LABS_<KEY> environment variable. Run specific values (title, environment, output
# folder) are set by failsafe in pom.xml.

# HarnessExtension attaches each test's browser context itself: tests get Page and page objects as parameters, which
# the field scan cannot see
reporting-labs.playwright.autoAttach=false

# each test's Playwright actions, and a full-page screenshot and trace of failed tests
reporting-labs.playwright.steps=true
reporting-labs.playwright.screenshot=on-failure
reporting-labs.playwright.trace=on-failure
reporting-labs.playwright.video=never

# the PDF copy needs a locally installed Chrome
reporting-labs.pdf=false

# run history for the trend chart; under target/, so `mvn clean` starts it afresh
reporting-labs.history.file=target/reporting-labs-history.json

# the backend each test ran on (set per test by HarnessExtension), as a filter and in the charts
reporting-labs.dimensions=backend
