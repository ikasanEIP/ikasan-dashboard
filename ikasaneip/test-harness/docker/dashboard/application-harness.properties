# Overrides applied to the dashboard when it runs inside the harness compose stack.
# Loaded via SPRING_CONFIG_ADDITIONAL_LOCATION, on top of the jar's own application.properties.

server.port=9090
server.host=0.0.0.0

# The distribution starts a standalone H2 TCP server (bin/ikasan.sh start-h2). In the harness we
# use an in-memory database instead, so every dashboard start is clean and nothing else is needed.
datasource.url=jdbc:h2:mem:esb;DB_CLOSE_DELAY=-1

# Keep the harness self-contained: no config server, no backups.
spring.config.import=
solr.backup.enabled=false

banner.text.message=Ikasan Test Harness

# A single dashboard node: no cluster peers to broadcast to (the jar's defaults point at a peer that
# does not exist here, which only produces connection errors). The node stays the fixed leader.
ikasan.dashboard.cluster.peer-urls=
