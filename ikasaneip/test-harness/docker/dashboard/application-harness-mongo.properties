# Run the dashboard against Mongo: exclude the Solr auto-configurations.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,org.springframework.boot.autoconfigure.thymeleaf.ThymeleafAutoConfiguration,org.springframework.boot.actuate.autoconfigure.ldap.LdapHealthContributorAutoConfiguration,me.snowdrop.boot.narayana.autoconfigure.NarayanaConfiguration,org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration,org.springframework.boot.actuate.autoconfigure.observation.web.client.HttpClientObservationsAutoConfiguration,org.ikasan.backup.IkasanBackupAutoConfiguration,org.springframework.boot.http.client.autoconfigure.reactive.ReactiveHttpClientAutoConfiguration,org.ikasan.SolrClientAutoConfiguration,org.ikasan.solr.initialisation.SolrInitialisationAutoConfiguration
mongodb.database=ikasan
