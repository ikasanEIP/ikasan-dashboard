# Test harness overrides for the scheduler-agent container (docker/compose.yml, profile 'agent').
# Loaded after application.properties, so these win.

# listen on the container network, not just localhost
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/scheduler-agent

# the url the agent publishes for itself (module metadata): the compose service name, reachable from the dashboard
public.service.protocol=http
public.service.address=scheduler-agent
public.service.port=8080

# the dashboard (both dashboard services carry the network alias 'dashboard'); the harness's REST credentials
ikasan.dashboard.extract.base.url=http://dashboard:9090
ikasan.dashboard.extract.username=admin
ikasan.dashboard.extract.password=admin
ikasan.load.balanced.dashboard.extract.base.url=http://dashboard:9090
module.extract.services.serviceInstances.[0].uri=http://dashboard:9090
module.extract.services.serviceInstances.[1].uri=http://dashboard:9090

# throwaway state: in-memory database, everything else under /tmp in the container
datasource.url=jdbc:h2:mem:agent;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
persistence.dir=/tmp/agent/persistence
big.queue.consumer.queueDir=/tmp/agent/bigqueue
scheduler.agent.log.folder=/tmp/agent/process-logs

# context.instance.recovery.active stays true (application.properties): on start the agent fetches the live job plan
# instances from the dashboard, and until that recovery has completed it refuses to run jobs
logging.level.org.ikasan=INFO
