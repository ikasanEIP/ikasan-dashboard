sudo: false
language: java
jdk:
   - openjdk11
node_js:
  - 10.17.0
cache:
  directories:
  - $HOME/.m2
  - $HOME/apache-maven-3.8.4
## export GPG details
before_install:
#  - echo -e "machine github.com\n  login $GITHUB_USER\n  password $GITHUB_PASSWORD" > $HOME/.netrc
  - echo $GPG_SECRET_KEYS | base64 --decode | $GPG_EXECUTABLE --import
  - echo $GPG_OWNERTRUST | base64 --decode | $GPG_EXECUTABLE --import-ownertrust
  - nvm install 10.17.0
  - npm install --save-dev @babel/core
  - npm install --save-dev @babel/plugin-proposal-object-rest-spread
  - export M2_HOME=$HOME/apache-maven-3.8.4
  - if [ ! -d $M2_HOME/bin ]; then curl https://archive.apache.org/dist/maven/maven-3/3.8.4/binaries/apache-maven-3.8.4-bin.tar.gz | tar zxf - -C $HOME; fi
  - export PATH=$M2_HOME/bin:$PATH

install:
  - mvn -U  --file ikasaneip/pom.xml --settings .settings.xml test -Dmaven.javadoc.skip=true -Djava.security.egd=file:/dev/./urandom -Dvaadin.offlineKey=eyJraWQiOiI1NDI3NjRlNzAwMDkwOGU2NWRjM2ZjMWRhYmY0ZTJjZDI4OTY2NzU4IiwidHlwIjoiSldUIiwiYWxnIjoiRVM1MTIifQ..AG0DCVechCmWVRJMQfcE1ZDPVKcoBuU3U_YDmzr9NrvczsjwyKofFuwwZ5KCie6FQi5IMWi5wuGpMFqWQFr7Fs5-AdymW1_2RXWaN6kSEY_T9G7_jdMQvdP9pLwamBesm8H1aSAZ7eP84WJ5674Xq2VQJml8vzVD1Fo1SkapnClyfoff -Pall -B -V

